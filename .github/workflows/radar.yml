name: SNIPER RADAR — scan horaire

on:
  # 7 min après chaque heure (la bougie 1H est fermée). Heure UTC.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sniper-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Scan
        run: python -X utf8 main.py

      - name: Sauvegarder l'état (carnet, météo)
        run: |
          git config user.name  "sniper-radar"
          git config user.email "sniper-radar@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "radar : état $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer la page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deploy
        uses: actions/deploy-pages@v4
