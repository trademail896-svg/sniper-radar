name: SNIPER RADAR — scan horaire

on:
  # GitHub saute souvent des passages programmés : on demande 4 essais par heure
  # (7 min après l'heure = bougie 1H fermée, puis aux 15 min). Heure UTC.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sniper-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Scan
        run: python -X utf8 main.py

      - name: Sauvegarder l'état (carnet, météo)
        run: |
          git config user.name  "sniper-radar"
          git config user.email "sniper-radar@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "radar : état $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer la page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub Pages échoue parfois de son côté (« artifact not found »,
      # « Deployment failed ») : on attend 60 s et on réessaie une fois.
      - name: Publier
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Attendre avant le 2e essai
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Publier (2e essai)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
